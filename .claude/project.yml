project:
  name: "Full Stack FastAPI Project"
  description: >-
    Full-stack template: FastAPI + SQLModel + PostgreSQL backend with a
    React 19 + Vite single-page frontend. JWT auth, Docker Compose,
    Traefik reverse proxy, an auto-generated typed API client, and
    Playwright end-to-end tests.
  language: "en"
  artifacts_path: "docs/project_context"

services:
  - name: "backend"
    path: "backend/"
    stack: "python-fastapi"
    skill: "backend-python"
    # Commands run from backend/. lint.sh = mypy + ty + ruff check + ruff format --check.
    lint_cmd: "bash scripts/lint.sh"
    build_cmd: ""
    # test.sh = coverage run -m pytest tests/ ; needs a reachable PostgreSQL.
    test_cmd: "bash scripts/test.sh"

  - name: "frontend"
    path: "frontend/"
    # React 19 + Vite 7 + TypeScript + TanStack Router/Query + Tailwind 4 + shadcn/ui.
    stack: "react-vite"
    # TODO: no React/Vite skill exists yet. Points at frontend-nextjs (React /
    # Tailwind / shadcn guidance applies; Next.js routing conventions do not).
    # Create a dedicated `frontend-react` skill and repoint this when ready.
    skill: "frontend-nextjs"
    lint_cmd: "bun run lint"
    build_cmd: "bun run build"
    # Playwright E2E; requires the Docker Compose stack (backend) running.
    test_cmd: "bun run test"

integrations:
  # Single source of truth for ClickUp coordinates — read by the
  # sync-clickup, creating-userstories, update-story-status and project-init
  # skills. Sync *state* (story↔task mapping) lives in docs/backlog/.clickup-sync.json.
  clickup:
    enabled: true
    workspace_id: "90151013948"
    list_id: "901523495004"
    list_name: "full-stack"
    default_assignee: "walid.iguider@neuralfactory.it"
    default_status: "planning"

architecture:
  service_dependencies:
    - from: "frontend"
      to: "backend"
      protocol: "HTTP/REST"
      description: >-
        The frontend calls the FastAPI backend through an auto-generated
        axios client (src/client/). Base URL is set via the VITE_API_URL
        environment variable.

  integration_contracts:
    - name: "openapi-schema"
      type: "schema"
      owner_service: "backend"
      consumer_services: ["frontend"]
      description: >-
        The backend's OpenAPI schema is the source of truth for the API.
        scripts/generate-client.sh dumps it to openapi.json and regenerates
        frontend/src/client/. Any backend change that alters the schema
        requires regenerating the frontend client.

onboarding:
